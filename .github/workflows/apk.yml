name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/apk.yml'
permissions:
  contents: write
defaults:
  run:
    working-directory: app
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar la web
        run: |
          mkdir -p www assets
          cp ../index.html www/index.html
          cp ../privacy.html www/privacy.html || true
          cp icon.png assets/icon-only.png 2>/dev/null || cp ../icon.png assets/icon-only.png 2>/dev/null || true
      - name: Instalar dependencias
        run: npm install
      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Iconos (si falla, usa el icono por defecto)
        continue-on-error: true
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#050a1c' --iconBackgroundColorDark '#050a1c'
      - name: Compilar APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../FiOS-demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FiOS-demo-apk
          path: FiOS-demo.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Fi.OS demo (APK de prueba) ${{ github.run_number }}
          files: FiOS-demo.apk
